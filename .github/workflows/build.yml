name: Build and release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  ROUTINE_REF: a54794384855d749b592e7bc05204855f3ef966e

jobs:
  build:
    name: Build x64 and ARM64
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout routine dependency
        uses: actions/checkout@v7
        with:
          repository: henrypp/routine
          ref: ${{ env.ROUTINE_REF }}
          path: dependencies/routine
          persist-credentials: false

      - name: Build release binaries
        shell: pwsh
        env:
          ROUTINE_DIR: ${{ github.workspace }}\dependencies\routine\src
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1

          if (-not $msbuild) {
            throw 'MSBuild was not found on the runner.'
          }

          foreach ($platform in @('x64', 'ARM64')) {
            $outDir = Join-Path $env:GITHUB_WORKSPACE "out\$platform"
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null

            & $msbuild memreduct.sln /m "/p:Configuration=Release" "/p:Platform=$platform" "/p:RoutineDir=$env:ROUTINE_DIR" "/p:RoutineLegacyApi=true" "/p:OutDir=$outDir\" /verbosity:minimal

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Package portable builds
        id: package
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path 'src/app.h' -Pattern '#define APP_VERSION L"([^"]+)"'

          if (-not $versionMatch) {
            throw 'APP_VERSION was not found in src/app.h.'
          }

          $version = $versionMatch.Matches[0].Groups[1].Value

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v\.?', ''

            if ($tagVersion -ne $version) {
              throw "Tag version '$tagVersion' does not match APP_VERSION '$version'."
            }
          }

          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null

          $architectures = [ordered]@{
            'x64' = 'x64'
            'ARM64' = 'arm64'
          }

          foreach ($entry in $architectures.GetEnumerator()) {
            $packageName = "memreduct-$version-$($entry.Value)"
            $stage = Join-Path $env:RUNNER_TEMP $packageName

            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item -LiteralPath "out\$($entry.Key)\memreduct.exe" -Destination $stage
            Copy-Item -LiteralPath 'bin/Readme.txt', 'bin/License.txt', 'bin/History.txt', 'bin/memreduct.lng' -Destination $stage

            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist\$packageName.zip" -CompressionLevel Optimal -Force
          }

          $checksums = Get-ChildItem -LiteralPath 'dist' -Filter '*.zip' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }

          Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Value $checksums -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: memreduct-${{ steps.package.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: memreduct-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
